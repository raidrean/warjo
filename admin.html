<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Warjo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<meta name="robots" content="noindex" />
<link rel="icon" href="img/Warjo_Logo.png" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-box">
    <img src="img/Warjo_Logo.png" alt="WARJO" />
    <h1>Masuk admin</h1>
    <input id="email" class="hidden" type="email" placeholder="Email admin" autocomplete="username" />
    <input id="pin" type="password" placeholder="PIN admin" autocomplete="current-password" required />
    <p id="login-err" class="err"></p>
    <button class="btn primary" type="submit">Masuk</button>
  </form>
</div>
<div id="app" class="hidden">
  <header class="bar">
    <img src="img/Warjo_Logo.png" alt="WARJO" />
    <nav>
      <button data-tab="orders" class="on">Pesanan <span id="badge-orders" class="pill"></span></button>
      <button data-tab="menu">Menu</button>
    </nav>
    <a class="btn ghost" href="index.html" target="_blank">Lihat katalog</a>
    <button id="logout" class="btn ghost">Keluar</button>
  </header>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script defer src="firebase-config.js"></script>
<script defer src="sync.js"></script>
<script defer src="menu-seed.js"></script>
<script defer src="admin.js"></script>
</body>
</html>
